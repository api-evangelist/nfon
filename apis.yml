aid: nfon
name: Nfon
description: >-
  NFON AG is a European provider of cloud telephony and unified communications
  (UCaaS/CPaaS), headquartered in Munich and serving businesses across 15+
  European countries. Its Cloudya cloud phone system and related products deliver
  business voice, video, contact centre and AI-assisted communication. For
  developers and integration partners, NFON publishes a set of RESTful JSON APIs
  hosted from the NFON-AG GitHub organisation: the flagship PBX Configuration API
  (OAuth 2.0, ~480 operations for provisioning tenants, extensions, devices,
  queues, groups, IVRs, phone books, licences and more — the successor to the
  legacy Service Portal API), the CTI API (server-to-server call control and
  Server-Sent-Event call/state streaming), and the Call History API offered under
  "Login with NFON" (OAuth 2.0 Authorization Code + PKCE) for retrieving,
  streaming and deleting call records with transcriptions and summaries. Use of
  the APIs is free of charge; access is provisioned by contacting
  integration@nfon.com.
