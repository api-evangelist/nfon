openapi: 3.2.0
info:
  description: APIs for managing PBX configuration, tenants, operators, licenses, and related resources
  title: PBX Configuration PBX Groups API
  version: 2026.07.20
servers:
- url: /configuration/v1
tags:
- name: PBX Groups
  description: PBX group management
paths:
  /operators/{operatorId}/pbx-groups/{pbxGroupName}:
    get:
      summary: Get PBX group
      parameters:
      - schema:
          type: string
        required: true
        in: path
        description: PBX group name
        name: pbxGroupName
      - schema:
          type: string
        required: true
        in: path
        name: operatorId
      tags:
      - PBX Groups
      operationId: get_211
      security:
      - oauth2:
        - tenant.operator
      - oauth2:
        - tenant.admin
      responses:
        '200':
          content:
            application/vnd.collection.next+json:
              schema:
                $ref: '#/components/schemas/NfonApiResponse'
              example:
                links: {}
                data:
                - value: pbx-group-eu-west
                  name: name
                href: /api/operators/example-id/pbx-groups/example-id
          description: PBX group found
        '404':
          description: Not found
  /pbx-groups/{pbxGroupName}:
    get:
      summary: Get PBX group
      parameters:
      - schema:
          type: string
        required: true
        in: path
        description: PBX group name
        name: pbxGroupName
      tags:
      - PBX Groups
      operationId: get_219
      security:
      - oauth2:
        - tenant.admin
      responses:
        '200':
          content:
            application/vnd.collection.next+json:
              schema:
                $ref: '#/components/schemas/NfonApiResponse'
              example:
                links: {}
                data:
                - value: pbx-group-eu-west
                  name: name
                href: /api/pbx-groups/example-id
          description: PBX group found
        '404':
          description: Not found
  /pbx-groups:
    get:
      summary: List PBX groups
      tags:
      - PBX Groups
      operationId: get_218
      security:
      - oauth2:
        - tenant.admin
      responses:
        '200':
          content:
            application/vnd.collection.next+json:
              schema:
                $ref: '#/components/schemas/NfonApiCollectionResponse'
          description: PBX groups retrieved
components:
  schemas:
    NfonApiCollectionResponse:
      oneOf:
      - $ref: '#/components/schemas/NfonApiCollectionResponsePage'
      - $ref: '#/components/schemas/NfonApiCollectionResponseNonPage'
      type: object
      description: Collection response envelope
    NfonApiCollectionResponsePage:
      properties:
        links:
          $ref: '#/components/schemas/CollectionLinks'
        offset:
          example: 0
          description: Current page offset
          format: int64
          type: integer
        total:
          example: 42
          description: Total number of items in the collection
          format: int64
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/NfonApiResponse'
          description: Items in this page
        size:
          example: 20
          description: Number of items in this page
          format: int32
          type: integer
        href:
          description: Self-link to this collection
          type: string
      type: object
      description: Paginated collection response envelope
    Links:
      description: Related resource links
      type: object
    NfonApiResponse:
      properties:
        links:
          $ref: '#/components/schemas/Links'
        data:
          description: Resource data (name/value pairs or structured object)
          type: object
        href:
          example: /api/sip-servers/100
          type: string
          description: Self-link to this resource
      type: object
      description: Standard API response envelope for a single resource
    String:
      properties:
        notNull:
          type: boolean
        notPresent:
          type: boolean
        present:
          type: boolean
        presentNotNull:
          type: boolean
        presentNull:
          type: boolean
        value:
          type: string
      type: object
      description: Link to the last page
    NfonApiCollectionResponseNonPage:
      properties:
        links:
          $ref: '#/components/schemas/Links'
        href:
          description: Self-link to this collection
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/NfonApiResponse'
          description: All items in the collection
      type: object
      description: Non-paginated collection response envelope
    CollectionLinks:
      properties:
        first:
          $ref: '#/components/schemas/String'
        prev:
          $ref: '#/components/schemas/String'
        next:
          $ref: '#/components/schemas/String'
        last:
          $ref: '#/components/schemas/String'
      type: object
      description: Pagination links for collection responses
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
