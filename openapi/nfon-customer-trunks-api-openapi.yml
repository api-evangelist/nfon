openapi: 3.2.0
info:
  description: APIs for managing PBX configuration, tenants, operators, licenses, and related resources
  title: PBX Configuration Customer Trunks API
  version: 2026.07.20
servers:
- url: /configuration/v1
tags:
- name: Customer Trunks
paths:
  /tenants/{participantExternalIdentifier}/trunks:
    get:
      parameters:
      - schema:
          type: string
        required: true
        in: path
        name: participantExternalIdentifier
      tags:
      - Customer Trunks
      operationId: get_190
      security:
      - oauth2:
        - tenant.manager
      - oauth2:
        - tenant.system-integrator
      - oauth2:
        - tenant.operator
      - oauth2:
        - tenant.admin
      responses:
        '200':
          content:
            application/vnd.collection.next+json:
              schema:
                $ref: '#/components/schemas/NfonApiCollectionResponse'
          description: Success
        '403':
          description: Insufficient permissions
  /tenants/{participantExternalIdentifier}/trunks/{trunkNumber}:
    get:
      parameters:
      - schema:
          type: string
        required: true
        in: path
        name: trunkNumber
      - schema:
          type: string
        required: true
        in: path
        name: participantExternalIdentifier
      tags:
      - Customer Trunks
      operationId: get_191
      security:
      - oauth2:
        - tenant.manager
      - oauth2:
        - tenant.system-integrator
      - oauth2:
        - tenant.operator
      - oauth2:
        - tenant.admin
      responses:
        '200':
          content:
            application/vnd.collection.next+json:
              schema:
                $ref: '#/components/schemas/NfonApiResponse'
              example:
                links:
                - href: /api/customers/K0001/customer-contracts/a1B2c3D4
                  rel: customerContract
                - href: /api/operators/OP001/softswitches/1
                  rel: softswitch
                - href: /api/customers/K0001/targets/phone-extensions/100
                  rel: dropExtension
                - href: /api/time-zones/Europe.Berlin
                  rel: timezone
                - href: /api/customers/K0001/blacklist-global-profiles/Standard
                  rel: inboundBlacklistGlobalProfile
                - href: /api/customers/K0001/blacklist-global-profiles/Standard
                  rel: outboundBlacklistGlobalProfile
                data:
                - value: '1'
                  name: trunkNumber
                - value: 'false'
                  name: hairpinCallsEnabled
                - value: 'false'
                  name: clipNoScreeningEnabled
                - value: a1B2c3D4e5F6
                  name: salesForceId
                - value: 'OFF'
                  name: suppressLineno
                href: /api/customers/example-id/trunks/example-id
          description: Success
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
    put:
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/TrunkPUTRequest'
      parameters:
      - schema:
          type: string
        required: true
        in: path
        name: trunkNumber
      - schema:
          type: string
        required: true
        in: path
        name: participantExternalIdentifier
      tags:
      - Customer Trunks
      operationId: put_55
      security:
      - oauth2:
        - tenant.manager
      - oauth2:
        - tenant.system-integrator
      - oauth2:
        - tenant.operator
      - oauth2:
        - tenant.admin
      responses:
        '404':
          description: Not found
        '204':
          description: Updated
        '400':
          description: Validation error
        '403':
          description: Insufficient permissions
  /tenants/{participantExternalIdentifier}/trunks/{trunkNumber}/available-drop-extensions:
    get:
      parameters:
      - schema:
          type: string
        required: true
        in: path
        name: participantExternalIdentifier
      - schema:
          type: string
        required: true
        in: path
        name: trunkNumber
      tags:
      - Customer Trunks
      operationId: get_189
      security:
      - oauth2:
        - tenant.manager
      - oauth2:
        - tenant.system-integrator
      - oauth2:
        - tenant.operator
      - oauth2:
        - tenant.admin
      responses:
        '200':
          content:
            application/vnd.collection.next+json:
              schema:
                $ref: '#/components/schemas/NfonApiCollectionResponse'
          description: Success
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
  /tenants/{participantExternalIdentifier}/trunks/{trunkNumber}/available-extensions:
    get:
      parameters:
      - schema:
          type: string
        required: true
        in: path
        name: participantExternalIdentifier
      - schema:
          type: string
        required: true
        in: path
        name: trunkNumber
      tags:
      - Customer Trunks
      operationId: getAvailableExtensions
      security:
      - oauth2:
        - tenant.manager
      - oauth2:
        - tenant.system-integrator
      - oauth2:
        - tenant.operator
      - oauth2:
        - tenant.admin
      responses:
        '200':
          content:
            application/vnd.collection.next+json:
              schema:
                $ref: '#/components/schemas/NfonApiCollectionResponse'
          description: Success
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
components:
  schemas:
    NfonApiCollectionResponse:
      oneOf:
      - $ref: '#/components/schemas/NfonApiCollectionResponsePage'
      - $ref: '#/components/schemas/NfonApiCollectionResponseNonPage'
      type: object
      description: Collection response envelope
    Enum:
      properties:
        notNull:
          type: boolean
        notPresent:
          type: boolean
        present:
          type: boolean
        presentNotNull:
          type: boolean
        presentNull:
          type: boolean
        value:
          type: object
      type: object
      example: 'OFF'
    NfonApiCollectionResponsePage:
      properties:
        links:
          $ref: '#/components/schemas/CollectionLinks'
        offset:
          example: 0
          description: Current page offset
          format: int64
          type: integer
        total:
          example: 42
          description: Total number of items in the collection
          format: int64
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/NfonApiResponse'
          description: Items in this page
        size:
          example: 20
          description: Number of items in this page
          format: int32
          type: integer
        href:
          description: Self-link to this collection
          type: string
      type: object
      description: Paginated collection response envelope
    TrunkPUTData:
      properties:
        suppressLineno:
          $ref: '#/components/schemas/Enum'
        hairpinCallsEnabled:
          $ref: '#/components/schemas/Boolean'
        clipNoScreeningEnabled:
          $ref: '#/components/schemas/Boolean'
        salesForceId:
          $ref: '#/components/schemas/String'
        trunkNumber:
          $ref: '#/components/schemas/Integer'
      type: object
    Links:
      description: Related resource links
      type: object
    Integer:
      properties:
        notNull:
          type: boolean
        notPresent:
          type: boolean
        present:
          type: boolean
        presentNotNull:
          type: boolean
        presentNull:
          type: boolean
        value:
          format: int32
          type: integer
      example: 1000
      type: object
      description: Subscribers soft limit
    NfonApiResponse:
      properties:
        links:
          $ref: '#/components/schemas/Links'
        data:
          description: Resource data (name/value pairs or structured object)
          type: object
        href:
          example: /api/sip-servers/100
          type: string
          description: Self-link to this resource
      type: object
      description: Standard API response envelope for a single resource
    String:
      properties:
        notNull:
          type: boolean
        notPresent:
          type: boolean
        present:
          type: boolean
        presentNotNull:
          type: boolean
        presentNull:
          type: boolean
        value:
          type: string
      type: object
      description: Link to the last page
    TrunkPUTRequest:
      properties:
        links:
          $ref: '#/components/schemas/TrunkPUTLinks'
        data:
          $ref: '#/components/schemas/TrunkPUTData'
        items:
          items:
            type: object
          type: array
        itemCount:
          format: int32
          type: integer
      type: object
    Boolean:
      properties:
        notNull:
          type: boolean
        notPresent:
          type: boolean
        present:
          type: boolean
        presentNotNull:
          type: boolean
        presentNull:
          type: boolean
        value:
          type: boolean
      type: object
      example: false
    NfonApiCollectionResponseNonPage:
      properties:
        links:
          $ref: '#/components/schemas/Links'
        href:
          description: Self-link to this collection
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/NfonApiResponse'
          description: All items in the collection
      type: object
      description: Non-paginated collection response envelope
    CollectionLinks:
      properties:
        first:
          $ref: '#/components/schemas/String'
        prev:
          $ref: '#/components/schemas/String'
        next:
          $ref: '#/components/schemas/String'
        last:
          $ref: '#/components/schemas/String'
      type: object
      description: Pagination links for collection responses
    TrunkPUTLinks:
      properties:
        outboundBlacklistGlobalProfile:
          $ref: '#/components/schemas/String'
        timezone:
          $ref: '#/components/schemas/String'
        dropExtension:
          $ref: '#/components/schemas/String'
        customerContract:
          $ref: '#/components/schemas/String'
        softswitch:
          $ref: '#/components/schemas/String'
        inboundBlacklistGlobalProfile:
          $ref: '#/components/schemas/String'
      type: object
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
