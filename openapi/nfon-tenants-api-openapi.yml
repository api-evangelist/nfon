          example: 'true'
        port_lock:
          type: boolean
          example: 'true'
        project_number_length:
          maximum: 6
          minimum: 0
          example: '4'
          format: int32
          type: integer
        queuemetrics_enabled:
          type: boolean
          example: 'false'
        speed_dial_length:
          maximum: 4
          minimum: 0
          example: '3'
          format: int64
          type: integer
        acureus_billing:
          type: boolean
          example: 'false'
      type: object
      required:
      - project_number_length
      description: OptionsRequestParams represents tenant options. This is named TenantOptions in the OpenAPI spec.
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
