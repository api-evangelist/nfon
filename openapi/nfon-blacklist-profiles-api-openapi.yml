openapi: 3.2.0
info:
  description: APIs for managing PBX configuration, tenants, operators, licenses, and related resources
  title: PBX Configuration Blacklist Profiles API
  version: 2026.07.20
servers:
- url: /configuration/v1
tags:
- name: Blacklist Profiles
  description: Blacklist profile management
paths:
  /operators/{operatorId}/blacklist-profiles/{blacklistProfileId}:
    get:
      summary: Get blacklist profile
      parameters:
      - schema:
          format: int64
          type: integer
        required: true
        in: path
        description: Blacklist profile identifier
        name: blacklistProfileId
      - schema:
          type: string
        required: true
        in: path
        name: operatorId
      tags:
      - Blacklist Profiles
      operationId: get_208
      security:
      - oauth2:
        - tenant.admin
      responses:
        '200':
          content:
            application/vnd.collection.next+json:
              schema:
                $ref: '#/components/schemas/NfonApiResponse'
          description: Blacklist profile found
        '404':
          description: Not found
components:
  schemas:
    Links:
      description: Related resource links
      type: object
    NfonApiResponse:
      properties:
        links:
          $ref: '#/components/schemas/Links'
        data:
          description: Resource data (name/value pairs or structured object)
          type: object
        href:
          example: /api/sip-servers/100
          type: string
          description: Self-link to this resource
      type: object
      description: Standard API response envelope for a single resource
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
